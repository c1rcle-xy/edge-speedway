# ─────────────────────────────────────────────────────────────
# edge-speedway · Cloudflare Workers 部署骨架
#
# ⚠ 跳转域名（站点列表）不写在这里，请在 Cloudflare 控制台手动配置：
#     Workers & Pages → 选中 Worker → Settings / 设置
#     → Variables and Secrets / 变量和机密 → Add / 添加
#     → 变量名 TARGETS，值填多个域名（每行一个）
#
#   为什么不写进下面的 [vars]？
#   用 wrangler deploy 时，wrangler.toml 的 [vars] 是普通环境变量的唯一来源，
#   部署会把控制台上手动添加的普通变量覆盖掉。所以这里刻意留空，
#   保证控制台里的配置不会被一次命令行部署清空。
#   （想在命令行部署时也绝对安全，可把 TARGETS 在控制台存成 Secret/机密，
#     wrangler 不会改动机密变量。）
# ─────────────────────────────────────────────────────────────

name = "edge-speedway"
main = "edge-speedway.js"
compatibility_date = "2026-01-01"

# 其余可调参数同样留空，全部在控制台手动设置：
#   TARGETS / FALLBACK / MODE / PROBES / TIMEOUT / BUDGET / METHOD
#   BUST / PRESERVE_PATH / MEMO_SECONDS / REDIRECT_STATUS / HTML / DEBUG
# 没设置的项会自动使用代码内默认值，不必全部填。

# 绑定自有域名（可选）
# [[routes]]
# pattern = "go.example.com/*"
# zone_name = "example.com"
